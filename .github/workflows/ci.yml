name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build pinned Flutter image
        run: docker build --platform linux/amd64 -t owrtpc-mobile-flutter:3.47.2 .
      - name: Check localization, formatting, analysis and tests
        run: ./tool/check.sh

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Build pinned Flutter base
        run: docker build --platform linux/amd64 -t owrtpc-mobile-flutter:3.47.2 .
      - name: Build Android toolchain
        run: docker build --platform linux/amd64 -t owrtpc-mobile-android:37-v1 -f docker/android.Dockerfile .
      - name: Verify release signing safeguards and Android artifacts
        run: ./tool/android.sh check
      - name: Scan resolved Android runtime dependencies
        run: sh tool/security-check.sh --sbom build/android-test/dependencies.cdx.json
      # Temporary CI-signed APK/AAB files are deliberately never uploaded.

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan history and security dependencies
        run: sh tool/security-check.sh

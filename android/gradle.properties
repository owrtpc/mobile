# Keep Gradle within Docker Desktop and standard CI runner memory budgets.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.caching=true
android.useAndroidX=true
# Each container build rechecks its inputs; native watchers are unreliable on
# Docker Desktop bind mounts under x86 emulation and offer no benefit here.
org.gradle.vfs.watch=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

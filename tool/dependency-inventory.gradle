import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    // Init scripts also run for Flutter's included Gradle plugin build.
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    app.tasks.register('owrtpcDependencyInventory') {
        doLast {
            def modules = app.configurations.getByName('releaseRuntimeClasspath')
                .incoming.resolutionResult.allComponents.collect { it.id }
                .findAll { it instanceof ModuleComponentIdentifier }
                .collect { id -> [type: 'library', group: id.group,
                    name: id.module, version: id.version,
                    purl: "pkg:maven/${id.group}/${id.module}@${id.version}"] }
                .sort { a, b -> a.purl <=> b.purl }
            def output = new File(app.layout.buildDirectory.get().asFile,
                'outputs/dependencies.cdx.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                bomFormat: 'CycloneDX', specVersion: '1.5', version: 1,
                components: modules]))
            println "OWRTPC: inventoried ${modules.size()} resolved Maven runtime dependencies"
        }
    }
}
